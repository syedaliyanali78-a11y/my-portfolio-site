<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Coffee House</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; text-align: center; }
        header { background: #1f1f1f; padding: 40px; }
        h1 { color: #d4a373; margin: 0; }
        p { color: #b0b0b0; }
        .btn { background: #d4a373; color: #000; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 20px; }
        .menu { padding: 40px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: #1f1f1f; padding: 20px; border-radius: 8px; width: 250px; border: 1px solid #333; }
        .card h3 { color: #d4a373; }
    </style>
</head>
<body>
    <header>
        <h1>Aroma &amp; Bean Cafe</h1>
        <p>Experience the finest blend of artisan coffee in town.</p>
        <a href="#menu" class="btn">Explore Menu</a>
    </header>
    <section id="menu" class="menu">
        <div class="card">
            <h3>Espresso</h3>
            <p>Rich and bold single shot brewed to absolute perfection.</p>
        </div>
        <div class="card">
            <h3>Cappuccino</h3>
            <p>Smooth espresso with velvety steamed milk and rich foam.</p>
        </div>
        <div class="card">
            <h3>Croissant</h3>
            <p>Freshly baked golden butter pastry served warm daily.</p>
        </div>
    </section>
</body>
</html>
